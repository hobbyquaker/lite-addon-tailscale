# etc/lighttpd.conf of lite-addon-tailscale (MIT): openccu-lite proxies /addons/tailscale/ to the daemon on
# the loopback and serves the 503 page while it is not running.
$HTTP["url"] == "/addons/tailscale" {
    url.redirect = ("" => "/addons/tailscale/")
}
$HTTP["url"] =~ "^/addons/tailscale/" {
    proxy.server = ("/addons/tailscale/" => (("host" => "127.0.0.1", "port" => 8299)))
    server.errorfile-prefix = "/usr/local/addons/tailscale/www/lighttpd-error-"
}
